<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>金塊ほり | あそび百貨</title>
  <style>
    .g-bar { position: absolute; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); z-index: 4; display: flex; gap: 12px; justify-content: center; padding: 0 16px; pointer-events: none; }
    .g-bar > * { pointer-events: auto; }
    .g-btn { flex: 1; max-width: 260px; min-height: 64px; border: 0; border-radius: 18px; padding: 10px 12px; font-family: var(--display); font-size: clamp(18px, 5vw, 24px); line-height: 1.15; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.4); transition: transform .08s, filter .15s, opacity .2s; touch-action: manipulation; }
    .g-btn small { display: block; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800; font-size: 14px; opacity: .9; }
    .g-btn:active { transform: translateY(4px) scale(.97); }
    .g-btn:disabled { opacity: .35; filter: grayscale(.6); }
    .g-main { background: linear-gradient(180deg, color-mix(in srgb, var(--accent2) 75%, #fff), var(--accent2) 55%, color-mix(in srgb, var(--accent2) 70%, #000)); box-shadow: 0 5px 0 color-mix(in srgb, var(--accent2) 45%, #000); }
    .g-safe { color: #1a1200; text-shadow: none; background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 70%, #fff), var(--accent) 60%, color-mix(in srgb, var(--accent) 75%, #000)); box-shadow: 0 5px 0 color-mix(in srgb, var(--accent) 45%, #000); }
  </style>
</head>
<body>
  <script type="module" src="./main.js"></script>
</body>
</html>
